<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARACHNIX | Mural de Vagas de Estágio em TI</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="cabecalho">
    <p class="nome-grupo">ARACHNIX</p>
    <h1>Mural de Vagas de Estágio em TI</h1>
  </header>

  <main>

    <section id="area-lista">

      <div id="area-busca">
        <div class="campo-grupo">
          <label for="campo-pesquisa">Pesquisar vaga</label>
          <input
            type="search"
            id="campo-pesquisa"
            placeholder="Digite o nome da empresa ou o cargo">
        </div>

        <div class="campo-grupo">
          <label for="filtro-modalidade">Modalidade</label>
          <select id="filtro-modalidade">
            <option value="todas">Todas as modalidades</option>
            <option value="Presencial">Presencial</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Remoto">Remoto</option>
          </select>
        </div>
      </div>

      <div id="area-ordenacao">
        <button type="button" id="btn-ordenar-bolsa">Ordenar por bolsa (maior para menor)</button>
        <button type="button" id="btn-restaurar-ordem">Restaurar ordem original</button>
      </div>

      <p id="area-contador">
        Vagas encontradas: <span id="contador-vagas">0</span>
      </p>

      <p id="mensagem-vazia" class="escondido">
        Nenhuma vaga encontrada para a pesquisa ou filtro selecionado.
      </p>

      <div id="lista-vagas"></div>

    </section>

    <section id="detalhes-vaga" class="escondido">
      <button type="button" id="btn-voltar">← Voltar para a lista de vagas</button>

      <h2>Detalhes da vaga</h2>

      <p><strong>Empresa:</strong> <span id="detalhe-empresa"></span></p>
      <p><strong>Cargo:</strong> <span id="detalhe-cargo"></span></p>
      <p><strong>Modalidade:</strong> <span id="detalhe-modalidade"></span></p>
      <p><strong>Bolsa:</strong> <span id="detalhe-bolsa"></span></p>
      <p><strong>Data de publicação:</strong> <span id="detalhe-data"></span></p>

      <h3>Requisitos</h3>
      <ul id="detalhe-requisitos"></ul>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer id="rodape">
    <p>&copy; 2026 ARACHNIX - Prova de PI II FATEC ZL (ADS 2 - Prof. Rodrigo Faustino)</p>
  </footer>

  <script src="dados.js"></script>
  <script src="script.js"></script>
</body>
</html>
